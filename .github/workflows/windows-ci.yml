name: Windows CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  windows-msvc:
    runs-on: windows-2022
    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows
      VCPKG_FEATURE_FLAGS: manifests,versions,binarycaching
      CTEST_OUTPUT_ON_FAILURE: 1
      VSLANG: 1033

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Setup vcpkg dependencies
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: '**/vcpkg.json'
          vcpkgGitCommitId: 'ff8f729804f07747ee5dae7d40a4a885066f9204'

      - name: Print toolchain diagnostics
        shell: pwsh
        run: |
          Write-Host "VCPKG_ROOT=$env:VCPKG_ROOT"
          cmake --version
          if (Test-Path "$env:VCPKG_ROOT/vcpkg.exe") {
            & "$env:VCPKG_ROOT/vcpkg.exe" version
          } else {
            Write-Error "vcpkg.exe not found under VCPKG_ROOT."
          }

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=$env:VCPKG_DEFAULT_TRIPLET `
            -DVCPKG_MANIFEST_MODE=ON `
            -DBUILD_TESTING=ON

      - name: Build
        shell: pwsh
        run: cmake --build build --config Debug --parallel

      - name: Test
        shell: pwsh
        run: ctest --test-dir build -C Debug --output-on-failure

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-ctest-logs
          path: |
            build/Testing/Temporary/LastTest.log
            build/Testing/Temporary/LastTestsFailed.log
