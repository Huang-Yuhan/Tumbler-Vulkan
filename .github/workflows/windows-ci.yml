name: Windows CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  windows-msvc:
    runs-on: windows-2022
    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows
      VCPKG_FEATURE_FLAGS: manifests,versions,binarycaching
      CTEST_OUTPUT_ON_FAILURE: 1
      VSLANG: 1033
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      VCPKG_FORCE_SYSTEM_BINARIES: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Bootstrap vcpkg (pinned baseline)
        shell: pwsh
        run: |
          $vcpkgRoot = "$env:RUNNER_TEMP\vcpkg"
          git init $vcpkgRoot
          git -C $vcpkgRoot remote add origin https://github.com/microsoft/vcpkg.git
          git -C $vcpkgRoot fetch --depth 1 origin ff8f729804f07747ee5dae7d40a4a885066f9204
          git -C $vcpkgRoot checkout FETCH_HEAD
          & "$vcpkgRoot\bootstrap-vcpkg.bat" -disableMetrics
          Add-Content -Path $env:GITHUB_ENV -Value "VCPKG_ROOT=$vcpkgRoot"

      - name: Print toolchain diagnostics
        shell: pwsh
        run: |
          Write-Host "VCPKG_ROOT=$env:VCPKG_ROOT"
          cmake --version
          where.exe git
          where.exe cmake
          if (Test-Path "$env:VCPKG_ROOT/vcpkg.exe") {
            & "$env:VCPKG_ROOT/vcpkg.exe" version
          } else {
            Write-Error "vcpkg.exe not found under VCPKG_ROOT."
          }

      - name: Install dependencies (vcpkg manifest)
        shell: pwsh
        run: |
          & "$env:VCPKG_ROOT\vcpkg.exe" install `
            --triplet $env:VCPKG_DEFAULT_TRIPLET `
            --x-manifest-root="$pwd" `
            --x-install-root="$pwd\build\vcpkg_installed" `
            --clean-after-build

      - name: Configure
        shell: pwsh
        run: |
          $vcpkgInstalledDir = "$pwd\build\vcpkg_installed"
          $vcpkgTripletDir = "$vcpkgInstalledDir\$env:VCPKG_DEFAULT_TRIPLET"
          $vulkanIncludeDir = "$pwd\build\vcpkg_installed\$env:VCPKG_DEFAULT_TRIPLET\include"
          $vulkanLib = "$pwd\build\vcpkg_installed\$env:VCPKG_DEFAULT_TRIPLET\lib\vulkan-1.lib"
          if (!(Test-Path "$vulkanIncludeDir\vulkan\vulkan.h")) {
            Write-Error "Missing Vulkan headers: $vulkanIncludeDir\vulkan\vulkan.h"
          }
          if (!(Test-Path $vulkanLib)) {
            Write-Error "Missing Vulkan library: $vulkanLib"
          }
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=$env:VCPKG_DEFAULT_TRIPLET `
            -DVCPKG_MANIFEST_MODE=ON `
            -DVCPKG_MANIFEST_INSTALL=OFF `
            -DVCPKG_INSTALLED_DIR="$vcpkgInstalledDir" `
            -DCMAKE_PREFIX_PATH="$vcpkgTripletDir" `
            -DVulkan_INCLUDE_DIR="$vulkanIncludeDir" `
            -DVulkan_LIBRARY="$vulkanLib" `
            -DBUILD_TESTING=ON

      - name: Build
        shell: pwsh
        run: cmake --build build --config Debug --parallel

      - name: Test
        shell: pwsh
        run: ctest --test-dir build -C Debug --output-on-failure

      - name: Print vcpkg logs on failure
        if: failure()
        shell: pwsh
        run: |
          $paths = @(
            "build/vcpkg-manifest-install.log",
            "build/CMakeFiles/CMakeError.log",
            "build/CMakeFiles/CMakeOutput.log",
            "build/vcpkg_installed/vcpkg/issue_body.md",
            "build/Testing/Temporary/LastTest.log",
            "build/Testing/Temporary/LastTestsFailed.log"
          )
          foreach ($path in $paths) {
            if (Test-Path $path) {
              Write-Host "========== $path =========="
              $tail = Get-Content -Path $path -Tail 120
              $tail | ForEach-Object { Write-Host $_ }

              $joined = ($tail -join "`n")
              if ($joined.Length -gt 5000) {
                $joined = $joined.Substring($joined.Length - 5000)
              }
              $escaped = $joined.Replace('%', '%25').Replace("`r", '').Replace("`n", '%0A')
              Write-Output "::error title=Failure tail ($path)::$escaped"
            } else {
              Write-Host "Not found: $path"
            }
          }
