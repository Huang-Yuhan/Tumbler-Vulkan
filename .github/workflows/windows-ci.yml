name: Windows CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  windows-msvc:
    runs-on: windows-2022
    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows
      VCPKG_FEATURE_FLAGS: manifests,versions,binarycaching
      CTEST_OUTPUT_ON_FAILURE: 1
      VSLANG: 1033
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bootstrap vcpkg (pinned baseline)
        shell: pwsh
        run: |
          $vcpkgRoot = "$env:RUNNER_TEMP\vcpkg"
          git init $vcpkgRoot
          git -C $vcpkgRoot remote add origin https://github.com/microsoft/vcpkg.git
          git -C $vcpkgRoot fetch --depth 1 origin ff8f729804f07747ee5dae7d40a4a885066f9204
          git -C $vcpkgRoot checkout FETCH_HEAD
          & "$vcpkgRoot\bootstrap-vcpkg.bat" -disableMetrics
          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Print toolchain diagnostics
        shell: pwsh
        run: |
          Write-Host "VCPKG_ROOT=$env:VCPKG_ROOT"
          cmake --version
          if (Test-Path "$env:VCPKG_ROOT/vcpkg.exe") {
            & "$env:VCPKG_ROOT/vcpkg.exe" version
          } else {
            Write-Error "vcpkg.exe not found under VCPKG_ROOT."
          }

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=$env:VCPKG_DEFAULT_TRIPLET `
            -DVCPKG_MANIFEST_MODE=ON `
            -DBUILD_TESTING=ON

      - name: Build
        shell: pwsh
        run: cmake --build build --config Debug --parallel

      - name: Test
        shell: pwsh
        run: ctest --test-dir build -C Debug --output-on-failure

      - name: Print vcpkg logs on failure
        if: failure()
        shell: pwsh
        run: |
          $paths = @(
            "build/vcpkg-manifest-install.log",
            "build/vcpkg_installed/vcpkg/issue_body.md",
            "build/Testing/Temporary/LastTest.log",
            "build/Testing/Temporary/LastTestsFailed.log"
          )
          foreach ($path in $paths) {
            if (Test-Path $path) {
              Write-Host "========== $path =========="
              Get-Content -Path $path -Tail 300
            } else {
              Write-Host "Not found: $path"
            }
          }
